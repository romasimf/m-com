default: &default
  adapter: postgresql
  encoding: unicode
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: 123456
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: m_com_development

test:
  <<: *default
  database: m_com_test

production:
  primary: &primary_production
    <<: *default
    database: m_com_production

  cache:
    <<: *primary_production
    database: m_com_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: m_com_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: m_com_production_cable
    migrations_paths: db/cable_migrate